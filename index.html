<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoDreams - Collaborative Task & Chat</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- GİRİŞ VƏ QEYDİYYAT EKRANI -->
    <div id="auth-modal" class="auth-modal">
        <div class="auth-box">
            <h1 class="logo-text">✨ DoDreams ✨</h1>
            <p id="auth-subtitle">Please sign in to continue</p>
            <form id="auth-form">
                <input type="text" id="auth-username" placeholder="Username" required>
                <input type="password" id="auth-password" placeholder="Password" required>
                <button type="submit" id="auth-btn">Sign In / Register</button>
            </form>
        </div>
    </div>

    <!-- ƏSAS SAYT KONTEYNERİ -->
    <div class="main-container" id="main-app" style="display: none;">
        
        <!-- Yuxarı Başlıq və Dil Seçimi -->
        <header class="app-header">
            <h1 class="logo-large">✨ DoDreams ✨</h1>
            <select id="language-select">
                <option value="en">English</option>
                <option value="az">Azərbaycan</option>
                <option value="ru">Русский</option>
            </select>
        </header>

        <!-- İki Sütunlu Əsas Layout -->
        <div class="workspace-grid">
            
            <!-- SOL TƏRƏF: To-Do və Dostlar -->
            <div class="left-column">
                
                <!-- Statistika Paneli -->
                <div class="stats-container">
                    <div class="stat-box">
                        <span id="total-count">0</span>
                        <small id="stat-total-label">Total</small>
                    </div>
                    <div class="stat-box">
                        <span id="completed-count">0</span>
                        <small id="stat-completed-label">Done</small>
                    </div>
                </div>

                <!-- Axtarış -->
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Search tasks...">
                </div>

                <!-- Tapşırıq Formu -->
                <form id="todo-form">
                    <input type="text" id="todo-input" placeholder="Add a new task..." required>
                    <select id="category-select">
                        <option value="work">Work</option>
                        <option value="study">Study</option>
                        <option value="personal">Personal</option>
                    </select>
                    <select id="priority-select">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                    <input type="date" id="due-date">
                    <button type="submit" id="add-btn">Add Task</button>
                </form>

                <!-- Filtrlər -->
                <div class="filters">
                    <button class="filter-btn active" data-filter="all" id="filter-all">All</button>
                    <button class="filter-btn" data-filter="active" id="filter-active">Active</button>
                    <button class="filter-btn" data-filter="completed" id="filter-completed">Completed</button>
                </div>

                <!-- Tapşırıq Siyahısı -->
                <ul id="todo-list"></ul>

                <!-- Dostlar Bölməsi -->
                <div class="friends-container">
                    <h3 id="friends-title">👥 Friends</h3>
                    <div class="add-friend-box">
                        <input type="text" id="friend-username" placeholder="Add friend by username...">
                        <button id="add-friend-btn">Add</button>
                    </div>
                    <ul id="friends-list"></ul>
                </div>

            </div>

            <!-- SAĞ TƏRƏF: Çat Bölməsi -->
            <div class="right-column">
                <div class="chat-container">
                    <h3 id="chat-title">💬 Chat</h3>
                    <div id="chat-messages">
                        <p class="no-chat-selected" id="no-chat-text">Select a friend to start chatting</p>
                    </div>
                    <div class="chat-input-box" id="chat-input-area" style="display: none;">
                        <input type="text" id="message-input" placeholder="Type a message...">
                        <button id="send-msg-btn">Send</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
